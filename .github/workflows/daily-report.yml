name: Daily English Report

on:
  schedule:
    # 매일 한국 시간 아침 8시 (UTC 23:00 전일)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 전체 작업 타임아웃 설정
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 최신 버전으로 업데이트
      timeout-minutes: 2
      
    - name: Set up Python
      uses: actions/setup-python@v5  # 최신 버전으로 업데이트
      timeout-minutes: 3
      with:
        python-version: '3.11'  # 최신 안정 버전 사용
        cache: 'pip'  # pip 캐시 활성화로 속도 개선

    - name: Install dependencies
      timeout-minutes: 3
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify environment
      run: |
        echo "Python version: $(python --version)"
        echo "Pip version: $(pip --version)"
        pip list
        
    - name: Send Daily Report
      timeout-minutes: 5  # 이메일 발송 타임아웃
      continue-on-error: false  # 실패 시 워크플로우 중단
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        EMAIL_HOST: smtp.gmail.com
        EMAIL_PORT: 587
      run: |
        echo "Starting daily report generation..."
        python send_daily_report.py
        echo "Daily report sent successfully!"
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: |
          *.log
          *.txt
        retention-days: 7
