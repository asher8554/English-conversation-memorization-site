# Notion 원문을 data.json으로 동기화하고 변경이 있으면 커밋하는 워크플로우
name: Sync Notion data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-notion-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID || '32f3d76f88748069b726d6b6d47f5afd' }}
      NOTION_VERSION: '2022-06-28'
      NOTION_FETCH_TIMEOUT_MS: '60000'
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Validate Notion token
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN secret이 필요합니다."
            exit 1
          fi

      - name: Restore Notion timeout state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .notion-sync-state
          key: notion-sync-timeout-${{ github.run_id }}
          restore-keys: notion-sync-timeout-

      - name: Sync data from Notion
        id: sync
        timeout-minutes: 10
        run: |
          state_dir=.notion-sync-state
          count_file="$state_dir/timeout-count"
          log_file="$(mktemp)"
          mkdir -p "$state_dir"
          previous=0
          if [ -f "$count_file" ] && grep -Eq '^[0-2]$' "$count_file"; then
            previous=$(cat "$count_file")
          fi

          attempts=1
          if [ "$previous" -ge 2 ]; then
            attempts=2
            echo "::warning::Notion API timeout이 2회 연속 발생해 요청 단계 로그와 1회 재시도를 사용합니다."
          fi

          exit_code=1
          for attempt in $(seq 1 "$attempts"); do
            : > "$log_file"
            if [ "$attempts" -gt 1 ]; then
              echo "Notion 동기화 진단 시도 $attempt/$attempts"
              NOTION_SYNC_DEBUG=1 node scripts/sync-notion-data.js 2>&1 | tee "$log_file"
            else
              node scripts/sync-notion-data.js 2>&1 | tee "$log_file"
            fi
            exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -eq 0 ]; then
              break
            fi
          done

          if [ "$exit_code" -eq 0 ]; then
            next=0
          elif grep -Fxq 'NOTION_FETCH_TIMEOUT' "$log_file"; then
            next=$((previous + 1))
            if [ "$next" -gt 2 ]; then next=2; fi
          else
            next=0
          fi

          printf '%s' "$next" > "$count_file"
          echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Save Notion timeout state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .notion-sync-state
          key: notion-sync-timeout-${{ github.run_id }}

      - name: Fail after saving Notion timeout state
        if: steps.sync.outputs.exit-code != '0'
        run: exit ${{ steps.sync.outputs.exit-code }}

      - name: Run tests
        run: |
          npm test
          npm run check

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json 변경 사항이 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: sync basic verbs from Notion"
          git push
