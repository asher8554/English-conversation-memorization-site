<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Conversation Memorization</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="container">
        <header>
            <h1>English Conversation Memorization</h1>
            <div>
                <button id="refreshBtn" class="toggle-btn" aria-label="Refresh Page" style="margin-right: 0.5rem;">🔄</button>
                <button id="darkModeToggle" class="toggle-btn" aria-label="Toggle Dark Mode">🌙</button>
            </div>
        </header>

        <div class="controls">
            <select id="daySelect" aria-label="Select Day"></select>
            <div class="font-controls">
                <button id="decreaseFont" aria-label="Decrease Font Size">A-</button>
                <button id="increaseFont" aria-label="Increase Font Size">A+</button>
            </div>
            <div class="sort-controls">
                <label><input type="checkbox" id="reverseOrder"> 역순</label>
                <label><input type="checkbox" id="randomOrder"> 무작위</label>
            </div>
        </div>

        <div class="card">
            <div id="cardContent" class="card-content fade-in">
                <div id="questionText" class="question"></div>
                <!-- 정답은 버튼을 누르면 표시 -->
                <button id="showAnswerBtn" class="show-answer-btn">Show Answer</button>
                <div id="answerText" class="answer"></div>
            </div>
        </div>

        <div class="navigation">
            <button id="prevBtn" disabled>&laquo; Prev</button>
            <button id="nextBtn" disabled>Next &raquo;</button>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
