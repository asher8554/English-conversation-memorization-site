<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Conversation Memorization</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="style.css?v=10">
</head>

<body>
    <div class="font-controls">
        <button id="refreshBtn" type="button" class="btn-circle" title="Refresh Page" aria-label="Refresh deployed data">🔄</button>
        <button id="statsBtn" type="button" class="btn-circle" title="View Statistics" aria-label="View review statistics">📊</button>
        <button id="settingsBtn" type="button" class="btn-circle" title="Voice Settings" aria-label="Open voice settings">⚙️</button>
        <button id="darkModeToggle" type="button" class="btn-circle" title="Toggle Dark Mode" aria-label="Toggle dark mode">🌙</button>
        <button id="decreaseFont" type="button" class="btn-circle" title="Decrease Font Size" aria-label="Decrease text size">-</button>
        <button id="increaseFont" type="button" class="btn-circle" title="Increase Font Size" aria-label="Increase text size">+</button>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="settingsTitle">
        <div class="modal-content">
            <button id="settingsCloseBtn" type="button" class="close-modal" aria-label="Close voice settings">&times;</button>
            <h2 id="settingsTitle">Voice Settings</h2>

            <div class="setting-item">
                <label for="koVoiceSelect">🇰🇷 Korean Voice</label>
                <select id="koVoiceSelect" class="voice-select"></select>
            </div>

            <div class="setting-item">
                <label for="enVoiceSelect">🇺🇸 English Voice</label>
                <select id="enVoiceSelect" class="voice-select"></select>
            </div>

            <div class="setting-row">
                <label class="checkbox-setting"><input type="checkbox" id="autoQuestionTts"> Auto-read questions</label>
                <label class="checkbox-setting"><input type="checkbox" id="autoAnswerTts"> Auto-read answers</label>
            </div>

            <div class="setting-item">
                <label for="koRateRange" class="rate-label">Korean Speed <span id="koRateValue">1.00x</span></label>
                <input id="koRateRange" class="voice-range" type="range" min="0.7" max="1.2" step="0.05" value="1">
            </div>

            <div class="setting-item">
                <label for="enRateRange" class="rate-label">English Speed <span id="enRateValue">0.90x</span></label>
                <input id="enRateRange" class="voice-range" type="range" min="0.7" max="1.2" step="0.05" value="0.9">
            </div>

            <div class="setting-actions">
                <button id="testVoiceBtn" class="btn btn-secondary">Test Voices 🔊</button>
                <button id="saveSettingsBtn" class="btn btn-primary">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- 통계 모달 -->
    <div id="statsModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="statsTitle">
        <div class="modal-content stats-content">
            <button id="statsCloseBtn" type="button" class="close-stats-modal close-modal" aria-label="Close review progress">&times;</button>
            <h2 id="statsTitle">📊 Review Progress</h2>
            <div class="stats-summary">
                <div class="stat-card">
                    <h3>Total Reviews</h3>
                    <p id="totalReviews">0</p>
                </div>
            </div>
            <div class="stats-list-container">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Reviews</th>
                            <th>Last Reviewed</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <!-- JS로 채워짐 -->
                    </tbody>
                </table>
            </div>
            <button id="resetStatsBtn" class="btn btn-danger" style="margin-top: 1rem; width: 100%;">🚫 Reset All
                Stats</button>
        </div>
    </div>

    <div class="container">
        <div class="course-selector" role="group" aria-label="Select Course">
            <button id="conversationCourseBtn" type="button" class="course-btn active" data-course-id="conversation" aria-pressed="true">영어회화</button>
            <button id="basicVerbsCourseBtn" type="button" class="course-btn" data-course-id="basic-verbs" aria-pressed="false">기본동사</button>
        </div>
        <div id="courseMeta" class="course-meta"></div>

        <div class="controls">
            <select id="daySelect" aria-label="Select Day"></select>
            <div class="sort-controls">
                <label><input type="checkbox" id="reverseOrder"> 역순</label>
                <label><input type="checkbox" id="randomOrder"> 무작위</label>
            </div>
        </div>

        <div>
            <div id="cardContent" class="fade-in">
                <div id="sectionLabel" class="section-label" aria-live="polite"></div>
                <div id="questionText" class="question"></div>
                <!-- 정답은 버튼을 누르면 표시 -->
                <button id="showAnswerBtn" class="btn btn-primary">Show Answer</button>
                <div id="answerText" class="answer"></div>
            </div>
        </div>

        <div class="navigation controls">
            <button id="prevBtn" class="btn btn-secondary" disabled>&laquo; Prev</button>
            <button id="nextBtn" class="btn btn-secondary" disabled>Next &raquo;</button>
        </div>
    </div>

    <script src="script.js?v=24"></script>
</body>

</html>
