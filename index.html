<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Conversation Memorization</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div class="font-controls">
        <button id="refreshBtn" class="btn-circle" title="Refresh Page">🔄</button>
        <button id="statsBtn" class="btn-circle" title="View Statistics">📊</button>
        <button id="settingsBtn" class="btn-circle" title="Voice Settings">⚙️</button>
        <button id="darkModeToggle" class="btn-circle" title="Toggle Dark Mode">🌙</button>
        <button id="decreaseFont" class="btn-circle" title="Decrease Font Size">-</button>
        <button id="increaseFont" class="btn-circle" title="Increase Font Size">+</button>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Voice Settings</h2>

            <div class="setting-item">
                <label for="koVoiceSelect">🇰🇷 Korean Voice</label>
                <select id="koVoiceSelect" class="voice-select"></select>
            </div>

            <div class="setting-item">
                <label for="enVoiceSelect">🇺🇸 English Voice</label>
                <select id="enVoiceSelect" class="voice-select"></select>
            </div>

            <div class="setting-actions">
                <button id="testVoiceBtn" class="btn btn-secondary">Test Voices 🔊</button>
                <button id="saveSettingsBtn" class="btn btn-primary">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- 통계 모달 -->
    <div id="statsModal" class="modal">
        <div class="modal-content stats-content">
            <span class="close-stats-modal close-modal">&times;</span>
            <h2>📊 Review Progress</h2>
            <div class="stats-summary">
                <div class="stat-card">
                    <h3>Total Reviews</h3>
                    <p id="totalReviews">0</p>
                </div>
            </div>
            <div class="stats-list-container">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Reviews</th>
                            <th>Last Reviewed</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <!-- JS로 채워짐 -->
                    </tbody>
                </table>
            </div>
            <button id="resetStatsBtn" class="btn btn-danger" style="margin-top: 1rem; width: 100%;">🚫 Reset All
                Stats</button>
        </div>
    </div>

    <div class="container">
        <div class="course-selector" role="group" aria-label="Select Course">
            <button type="button" class="course-btn active" data-course-id="conversation">영어회화</button>
            <button type="button" class="course-btn" data-course-id="basic-verbs">기본동사</button>
        </div>
        <div id="courseMeta" class="course-meta"></div>

        <div class="controls">
            <select id="daySelect" aria-label="Select Day"></select>
            <div class="sort-controls">
                <label><input type="checkbox" id="reverseOrder"> 역순</label>
                <label><input type="checkbox" id="randomOrder"> 무작위</label>
            </div>
        </div>

        <div class="card">
            <div id="cardContent" class="card-content fade-in">
                <div id="questionText" class="question"></div>
                <!-- 정답은 버튼을 누르면 표시 -->
                <button id="showAnswerBtn" class="btn btn-primary">Show Answer</button>
                <div id="answerText" class="answer"></div>
            </div>
        </div>

        <div class="navigation controls">
            <button id="prevBtn" class="btn btn-secondary" disabled>&laquo; Prev</button>
            <button id="nextBtn" class="btn btn-secondary" disabled>Next &raquo;</button>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
